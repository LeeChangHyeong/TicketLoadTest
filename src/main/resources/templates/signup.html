<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - TicketLoadTest</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary: #9b59b6;
            --primary-hover: #8e44ad;
            --border-color: #333;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .signup-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            margin-bottom: 2rem;
            display: block;
            text-decoration: none;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            background-color: #252525;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
        }

        .btn-signup {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .btn-signup:hover {
            background-color: var(--primary-hover);
        }

        .footer-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <a href="/" class="logo">TicketLoadTest</a>
    <form th:action="@{/signup}" th:object="${userForm}" method="post">
        <div class="form-group">
            <label>이름</label>
            <input type="text" th:field="*{name}" placeholder="홍길동" required>
        </div>
        <div class="form-group">
            <label>이메일</label>
            <input type="email" th:field="*{email}" placeholder="example@ticket.com" required>
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" th:field="*{password}" placeholder="8자 이상 입력" required>
        </div>
        <!-- 비밀번호 확인 필드는 로직 단순화를 위해 일단 제거하거나 추후 JS로 구현. 현재는 생략 -->
        
        <div th:if="${errorMessage}" style="color: #ff6b6b; margin-bottom: 1rem; font-size: 0.9rem;">
            <p th:text="${errorMessage}"></p>
        </div>

        <button type="submit" class="btn-signup">가입하기</button>
    </form>
    <div class="footer-links">
        이미 계정이 있으신가요? <a href="/login">로그인</a>
    </div>
</div>

</body>
</html>
