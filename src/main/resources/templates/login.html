<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - TicketLoadTest</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary: #9b59b6;
            --primary-hover: #8e44ad;
            --border-color: #333;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
            margin-bottom: 2rem;
            display: block;
            text-decoration: none;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            background-color: #252525;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
        }

        .footer-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <a href="/" class="logo">TicketLoadTest</a>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>이메일</label>
            <input type="email" name="email" placeholder="example@ticket.com" required>
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        
        <div th:if="${param.error}" style="color: #ff6b6b; margin-bottom: 1rem; font-size: 0.9rem;">
            <p>이메일 또는 비밀번호가 올바르지 않습니다.</p>
        </div>
        <div th:if="${param.logout}" style="color: #9b59b6; margin-bottom: 1rem; font-size: 0.9rem;">
            <p>로그아웃 되었습니다.</p>
        </div>

        <button type="submit" class="btn-login">로그인</button>
    </form>
    <div class="footer-links">
        계정이 없으신가요? <a href="/signup">회원가입</a>
    </div>
</div>

</body>
</html>
